name: ManaPool Offline Repricing Pilot - 25 Updates

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CONFIRM_25_PRICE_UPDATES to authorize up to 25 live price changes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manapool-price-updates
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANAPOOL_EMAIL: ${{ secrets.MANAPOOL_EMAIL }}
      MANAPOOL_TOKEN: ${{ secrets.MANAPOOL_TOKEN }}
      PILOT_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Pause singles, update at most 25 prices, restore visibility
        run: python pilot_25.py
      - name: Upload report and update journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manapool-pilot-${{ github.run_id }}
          path: |
            repricing_report.csv
            pilot_25_results.csv
          if-no-files-found: ignore
          retention-days: 30
