name: Check ManaPool Market Prices (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-market-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect inventory market-price fields
        env:
          MANAPOOL_EMAIL: ${{ secrets.MANAPOOL_EMAIL }}
          MANAPOOL_TOKEN: ${{ secrets.MANAPOOL_TOKEN }}
        run: python market_check.py
