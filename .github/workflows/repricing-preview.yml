name: ManaPool Repricing Preview (Read Only)

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate read-only report
        env:
          MANAPOOL_EMAIL: ${{ secrets.MANAPOOL_EMAIL }}
          MANAPOOL_TOKEN: ${{ secrets.MANAPOOL_TOKEN }}
        run: python repricing_preview.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: repricing-report
          path: repricing_report.csv
          retention-days: 7
